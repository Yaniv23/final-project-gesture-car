[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; FreeRTOS configuration
; Note: FreeRTOS is included by default in ESP32 Arduino framework
; We configure it via build flags

; Build flags for FreeRTOS and debugging
build_flags = 
    -DFREERTOS_ENABLED
    -DCONFIG_FREERTOS_HZ=1000
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM

; Libraries (add as needed)
lib_deps = 
    ; ESP32 libraries are built-in
    ESP32Servo@^3.0.0
    ; External libraries go here if needed later

; Upload settings
upload_speed = 921600
upload_port = /dev/ttyUSB1  ; Adjust for your system (COM port on Windows)

; Monitor settings (Serial debugging)
monitor_speed = 115200
monitor_filters = 
    time
    default

; Build options
build_type = release

