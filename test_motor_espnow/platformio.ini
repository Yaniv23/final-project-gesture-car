; PlatformIO Project Configuration File for Motor + ESP-NOW Testing
;
; This project tests motor control and ESP-NOW command reception
; WITHOUT servo motor or ultrasonic sensor components
;
; This configuration automatically includes source files from ../Vehicule/src
; using lib_extra_dirs and a Python script that filters only needed files

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = 
	-DFREERTOS_ENABLED
	-DCONFIG_FREERTOS_HZ=1000
	-DCORE_DEBUG_LEVEL=3
	-DSIMULATION_MODE=0
	-I../Vehicule/src/control
	-I../Vehicule/src
	-I../Vehicule/src/drivers
	-I../Vehicule/src/communication
	-I../Vehicule/src/shared
	-I../Vehicule/src/safety
	; Explicitly include Arduino framework libraries for external source files
	; PlatformIO should add these automatically, but BuildSources may need them
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFi/src
; Dependencies (WiFi and ESP-NOW are part of Arduino framework, but ensure they're available)
; No additional lib_deps needed - WiFi.h and esp_now.h are in the framework
; Use Python script to automatically include only needed .cpp files
; Note: lib_extra_dirs is NOT used to avoid auto-compiling ALL .cpp files
; The script explicitly selects which files to include
extra_scripts = 
	pre:extra_script.py
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
upload_port = /dev/ttyUSB0
monitor_filters = 
	time
	default
build_type = debug

