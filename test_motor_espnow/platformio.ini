; PlatformIO Project Configuration File for Motor + ESP-NOW Testing
;
; This project tests motor control and ESP-NOW command reception
; WITHOUT servo motor or ultrasonic sensor components

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = 
	-DFREERTOS_ENABLED
	-DCONFIG_FREERTOS_HZ=1000
	-DCORE_DEBUG_LEVEL=3
	-DSIMULATION_MODE=0
	-I../Vehicule/src/control
	-I../Vehicule/src
	-I../Vehicule/src/drivers
	-I../Vehicule/src/communication
	-I../Vehicule/src/shared
	-I../Vehicule/src/safety
extra_scripts = 
	pre:extra_script.py
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
upload_port = /dev/ttyUSB0
monitor_filters = 
	time
	default
build_type = debug

