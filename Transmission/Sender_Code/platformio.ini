[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Upload settings
upload_speed = 921600
upload_port = /dev/ttyUSB0  ; CH340 detected - adjust if needed

; Monitor settings (Serial debugging)
monitor_speed = 115200
monitor_filters = 
    time
    default

; Build options
build_type = release

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3

monitor_port = /dev/ttyUSB0

