[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Use this folder as the source so Reciver_Code.ino builds without moving files
src_dir = .

; Upload settings (adjust port if needed)
upload_speed = 921600
upload_port = /dev/ttyUSB0

; Monitor settings (Serial debugging)
monitor_speed = 115200
monitor_filters =
    time
    default

; Build options
build_type = release

; Optional build flags (keep in sync with sender if desired)
build_flags =
    -DCORE_DEBUG_LEVEL=3




