; PlatformIO Project Configuration File for Motor Driver Testing
;
; This project tests all motor commands to verify driver functionality

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = 
	-DCORE_DEBUG_LEVEL=3
	-I../Car/src/control
	-I../Car/src
	-I../Car/src/drivers
extra_scripts = 
	extra_script.py
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
monitor_filters = 
	time
	default
build_type = debug

