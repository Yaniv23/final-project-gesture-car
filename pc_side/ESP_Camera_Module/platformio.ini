[platformio]
pio run -e esp32cam -t uploaddefault_envs = esp32cam

[env:esp32cam]
monitor_rts = 0
monitor_dtr = 0
platform = espressif32@6.9.0
board = esp32cam
framework = arduino

lib_deps =
  esp32-camera
CONFIG_ESP32_SPIRAM_SUPPORT=y
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue

upload_port = /dev/ttyUSB0
upload_speed = 921600

monitor_port = /dev/ttyUSB0
monitor_speed = 115200

[env:esp32cam_s3_wroom_n16r8]
platform = espressif32@6.9.0
board = esp32cam_s3_wroom_n16r8
framework = arduino

lib_deps =
  esp32-camera

build_flags =
  -DBOARD_HAS_PSRAM

upload_port = /dev/ttyUSB0
upload_speed = 921600

monitor_port = /dev/ttyUSB0
monitor_speed = 115200
